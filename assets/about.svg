<svg fill="none" width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    .bg { fill: #0d1117; }
    .glass-panel {
      fill: #161b22;
      fill-opacity: 0.75;
      stroke: url(#shimmerBorderGrad);
      stroke-width: 1.5;
      rx: 14px;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4));
    }
    .inner-card {
      fill: #21262d;
      fill-opacity: 0.6;
      stroke: #30363d;
      stroke-width: 1;
      rx: 10px;
    }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 1.5px;
    }
    .value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #f0f6fc;
    }
    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #3fb950;
      letter-spacing: 1px;
    }
    .status-dot {
      fill: #3fb950;
      animation: pulseDot 2s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 800;
      fill: url(#platinumGrad);
    }
    .glow {
      animation: glowPulse 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>

    <linearGradient id="shimmerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#8b949e" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Deep Base -->
  <rect width="800" height="200" class="bg" rx="14"/>

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="100" r="160" fill="#ffffff" class="glow" filter="blur(65px)"/>

  <!-- Glassmorphic Outer Panel -->
  <rect x="10" y="10" width="780" height="180" class="glass-panel"/>

  <!-- Left Section: Profile Overview Card -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="240" height="140" class="inner-card"/>
    
    <!-- Operational Status Indicator -->
    <g transform="translate(18, 22)">
      <circle cx="6" cy="6" r="4" class="status-dot"/>
      <text x="16" y="9" class="status-text">SYSTEM OPERATIONAL</text>
    </g>

    <text x="18" y="52" class="title-text">SHOXJAXON</text>
    <text x="18" y="72" class="title-text" fill="#8b949e">ATABAYEV</text>
    
    <text x="18" y="98" class="label">ROLE</text>
    <text x="18" y="116" class="value">Full Stack Developer</text>
  </g>

  <!-- Right Section: Core Pillars -->
  <g transform="translate(290, 30)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="460" height="38" class="inner-card"/>
      <text x="16" y="24" class="label">CORE FOCUS</text>
      <text x="130" y="24" class="value">API Architecture &amp; Scalable Systems</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 51)">
      <rect x="0" y="0" width="460" height="38" class="inner-card"/>
      <text x="16" y="24" class="label">DATABASE</text>
      <text x="130" y="24" class="value">PostgreSQL • MySQL • Redis Tuning</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="460" height="38" class="inner-card"/>
      <text x="16" y="24" class="label">PRINCIPLES</text>
      <text x="130" y="24" class="value">Clean Architecture • High Performance</text>
    </g>
  </g>
</svg>
