<svg fill="none" width="800" height="80" viewBox="0 0 800 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes lineGlow {
      0%, 100% { opacity: 0.3; stroke: #30363d; }
      50% { opacity: 0.8; stroke: #58a6ff; }
    }
    .bg { fill: #0d1117; }
    .quote {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 1px;
    }
    .accent-line {
      stroke-width: 1;
      animation: lineGlow 4s ease-in-out infinite;
    }
  </style>

  <rect width="800" height="80" class="bg" rx="8"/>
  <rect x="1" y="1" width="798" height="78" fill="none" rx="7" stroke="#21262d" stroke-width="1"/>

  <line x1="120" y1="22" x2="680" y2="22" class="accent-line"/>
  
  <text x="400" y="50" text-anchor="middle" class="quote">"Crafting elegant software with discipline and precision."</text>
</svg>
