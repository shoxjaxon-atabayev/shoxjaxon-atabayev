<svg fill="none" width="800" height="75" viewBox="0 0 800 75" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes linePulse {
      0%, 100% { opacity: 0.3; stroke: #30363d; }
      50% { opacity: 0.8; stroke: #8b949e; }
    }
    .bg { fill: #0d1117; }
    .quote {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 1px;
    }
    .accent-line {
      stroke-width: 1;
      animation: linePulse 4s ease-in-out infinite;
    }
  </style>

  <rect width="800" height="75" class="bg" rx="8"/>
  <rect x="1.5" y="1.5" width="797" height="72" fill="none" rx="7" stroke="#21262d" stroke-width="1"/>

  <line x1="140" y1="20" x2="660" y2="20" class="accent-line"/>
  
  <text x="400" y="47" text-anchor="middle" class="quote">"Crafting elegant software with discipline and precision."</text>
</svg>
