<svg fill="none" width="800" height="75" viewBox="0 0 800 75" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes linePulse {
      0%, 100% { opacity: 0.3; stroke: #30363d; }
      50% { opacity: 0.8; stroke: #8b949e; }
    }
    .bg { fill: #0d1117; }
    .glass-card {
      fill: #161b22;
      fill-opacity: 0.7;
      stroke: url(#glassBorder);
      stroke-width: 1.2;
      rx: 10px;
    }
    .quote {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 1px;
    }
    .accent-line {
      stroke-width: 1;
      animation: linePulse 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#21262d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6e7681" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Silver Shimmer Sweep -->
    <clipPath id="cardClip">
      <rect x="8" y="8" width="784" height="59" rx="10"/>
    </clipPath>
    <linearGradient id="silverShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="75" class="bg" rx="10"/>
  <rect x="8" y="8" width="784" height="59" class="glass-card"/>

  <line x1="150" y1="23" x2="650" y2="23" class="accent-line"/>
  
  <text x="400" y="47" text-anchor="middle" class="quote">"Crafting elegant software with discipline and precision."</text>

  <!-- Silver Shimmer Animation -->
  <g clip-path="url(#cardClip)">
    <rect y="-40" width="220" height="250" fill="url(#silverShimmer)" transform="rotate(20, 400, 37.5)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="-230 0; 870 0; 870 0" keyTimes="0; 0.6; 1" dur="7s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
</svg>
