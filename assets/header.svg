<svg fill="none" width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes glassGlow {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    .bg { fill: #0d1117; }
    .glass-card {
      fill: #161b22;
      fill-opacity: 0.7;
      stroke: url(#glassBorder);
      stroke-width: 1.2;
      rx: 14px;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 3px;
      fill: url(#platinumGrad);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }
    .subtitle {
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 4px;
    }
    .glass-pill {
      fill: #21262d;
      fill-opacity: 0.8;
      stroke: #484f58;
      stroke-width: 1;
      rx: 8px;
    }
    .pill-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #c9d1d9;
      letter-spacing: 1px;
    }
    .glow-bg {
      animation: glassGlow 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <!-- Platinum Silver Text Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c9d1d9" />
      <stop offset="100%" stop-color="#8b949e" />
    </linearGradient>

    <!-- Frosted Glass Solid Smooth Border Gradient (0% dashed lines) -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#21262d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6e7681" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle Geometric Mesh -->
    <pattern id="glassGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Deep Base -->
  <rect width="800" height="150" class="bg" rx="14"/>
  <rect width="800" height="150" fill="url(#glassGrid)" rx="14"/>
  
  <!-- Soft Platinum White Glow (ZERO BLUE) -->
  <circle cx="400" cy="75" r="140" fill="#ffffff" class="glow-bg" filter="blur(55px)"/>

  <!-- Glassmorphic Layered Translucent Card (Solid Smooth Glass Frame) -->
  <rect x="12" y="12" width="776" height="126" class="glass-card"/>

  <!-- Card Content -->
  <g text-anchor="middle">
    <text x="400" y="58" class="title">SHOXJAXON ATABAYEV</text>
    <text x="400" y="88" class="subtitle">FULL STACK &amp; BACKEND DEVELOPER</text>
    
    <!-- Glassmorphic Translucent Pills -->
    <g transform="translate(255, 102)">
      <rect x="0" y="0" width="85" height="22" class="glass-pill"/>
      <text x="42.5" y="15" text-anchor="middle" class="pill-text">SYSTEMS</text>

      <rect x="95" y="0" width="95" height="22" class="glass-pill"/>
      <text x="142.5" y="15" text-anchor="middle" class="pill-text">ARCHITECTURE</text>

      <rect x="200" y="0" width="90" height="22" class="glass-pill"/>
      <text x="245" y="15" text-anchor="middle" class="pill-text">DATABASE</text>
    </g>
  </g>
</svg>
