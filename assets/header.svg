<svg fill="none" width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }
    @keyframes gradientShift {
      0% { stop-color: #f0f6fc; }
      50% { stop-color: #8b949e; }
      100% { stop-color: #f0f6fc; }
    }
    .bg { fill: #0d1117; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 3px;
    }
    .subtitle {
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 4px;
    }
    .badge-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #c9d1d9;
      letter-spacing: 1px;
    }
    .border-box {
      stroke: url(#grayGrad);
      stroke-width: 1.5;
      rx: 8px;
    }
    .glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="silverTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#f0f6fc" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e7681" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#21262d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="150" class="bg" rx="10"/>
  <rect width="800" height="150" fill="url(#grid)" rx="10"/>
  
  <!-- Subtle Silver Glow -->
  <circle cx="400" cy="75" r="130" fill="#8b949e" opacity="0.08" class="glow" filter="blur(45px)"/>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="796" height="146" fill="none" class="border-box"/>

  <!-- Content -->
  <g text-anchor="middle">
    <text x="400" y="62" class="title" fill="url(#silverTitle)">SHOXJAXON ATABAYEV</text>
    <text x="400" y="93" class="subtitle">FULL STACK &amp; BACKEND DEVELOPER</text>
    
    <!-- Minimal Metallic Badges -->
    <g transform="translate(255, 110)">
      <rect x="0" y="0" width="85" height="22" class="badge-bg"/>
      <text x="42.5" y="15" text-anchor="middle" class="badge-text">SYSTEMS</text>

      <rect x="95" y="0" width="95" height="22" class="badge-bg"/>
      <text x="142.5" y="15" text-anchor="middle" class="badge-text">ARCHITECTURE</text>

      <rect x="200" y="0" width="90" height="22" class="badge-bg"/>
      <text x="245" y="15" text-anchor="middle" class="badge-text">DATABASE</text>
    </g>
  </g>
</svg>
