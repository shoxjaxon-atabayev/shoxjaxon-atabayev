<svg fill="none" width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes borderSlide {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 800; }
    }
    .bg { fill: #0d1117; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #f0f6fc;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #58a6ff;
      letter-spacing: 4px;
    }
    .badge-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 1px;
    }
    .border-line {
      stroke: #58a6ff;
      stroke-width: 1.5;
      stroke-dasharray: 40 20;
      opacity: 0.6;
      animation: borderSlide 25s linear infinite;
    }
    .glow-circle {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="160" class="bg" rx="10"/>
  <rect width="800" height="160" fill="url(#grid)" rx="10"/>
  
  <!-- Subtle Single Accent Glow -->
  <circle cx="400" cy="80" r="120" fill="#58a6ff" opacity="0.08" class="glow-circle" filter="blur(40px)"/>

  <!-- Border Box -->
  <rect x="1.5" y="1.5" width="797" height="157" fill="none" rx="9" stroke="#21262d" stroke-width="1"/>
  <rect x="1.5" y="1.5" width="797" height="157" fill="none" rx="9" class="border-line"/>

  <!-- Main Content -->
  <g text-anchor="middle">
    <text x="400" y="65" class="title">SHOXJAXON ATABAYEV</text>
    <text x="400" y="98" class="subtitle">FULL STACK &amp; BACKEND DEVELOPER</text>
    
    <!-- Minimalist Unified Pill Badges -->
    <g transform="translate(255, 116)">
      <rect x="0" y="0" width="85" height="22" class="badge-bg"/>
      <text x="42.5" y="15" text-anchor="middle" class="badge-text">SYSTEMS</text>

      <rect x="95" y="0" width="95" height="22" class="badge-bg"/>
      <text x="142.5" y="15" text-anchor="middle" class="badge-text">ARCHITECTURE</text>

      <rect x="200" y="0" width="90" height="22" class="badge-bg"/>
      <text x="245" y="15" text-anchor="middle" class="badge-text">DATABASE</text>
    </g>
  </g>
</svg>
