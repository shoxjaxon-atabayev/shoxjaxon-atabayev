<svg fill="none" width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes silverPulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    .bg { fill: #0d1117; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 3px;
      fill: url(#silverGrad);
    }
    .subtitle {
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 4px;
    }
    .badge-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #c9d1d9;
      letter-spacing: 1px;
    }
    .solid-border {
      stroke: url(#borderGrad);
      stroke-width: 1.2;
      rx: 10px;
    }
    .glow {
      animation: silverPulse 4s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e7681"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#484f58"/>
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="150" class="bg" rx="12"/>
  <rect width="800" height="150" fill="url(#grid)" rx="12"/>
  
  <!-- Subtle Silver Glow (No Blue) -->
  <circle cx="400" cy="75" r="140" fill="#ffffff" class="glow" filter="blur(50px)"/>

  <!-- Solid Smooth Metallic Border (NO dashed line) -->
  <rect x="2" y="2" width="796" height="146" fill="none" class="solid-border"/>

  <!-- Header Text & Badges -->
  <g text-anchor="middle">
    <text x="400" y="62" class="title">SHOXJAXON ATABAYEV</text>
    <text x="400" y="93" class="subtitle">FULL STACK &amp; BACKEND DEVELOPER</text>
    
    <!-- Minimal Metallic Badges -->
    <g transform="translate(255, 110)">
      <rect x="0" y="0" width="85" height="22" class="badge-bg"/>
      <text x="42.5" y="15" text-anchor="middle" class="badge-text">SYSTEMS</text>

      <rect x="95" y="0" width="95" height="22" class="badge-bg"/>
      <text x="142.5" y="15" text-anchor="middle" class="badge-text">ARCHITECTURE</text>

      <rect x="200" y="0" width="90" height="22" class="badge-bg"/>
      <text x="245" y="15" text-anchor="middle" class="badge-text">DATABASE</text>
    </g>
  </g>
</svg>
