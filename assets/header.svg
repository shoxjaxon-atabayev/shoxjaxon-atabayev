<svg fill="none" width="800" height="170" viewBox="0 0 800 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(88, 166, 255, 0.8)); }
    }
    @keyframes borderSlide {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    .bg { fill: #0d1117; }
    .card-bg { fill: #161b22; rx: 12px; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      animation: textGlow 4s ease-in-out infinite;
    }
    .subtitle {
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #8b949e;
      letter-spacing: 3px;
    }
    .badge-text {
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #58a6ff;
      letter-spacing: 1px;
    }
    .border-line {
      stroke: url(#gradient);
      stroke-width: 2;
      stroke-dasharray: 20 10;
      animation: borderSlide 30s linear infinite;
    }
    .glow-circle {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="170" class="bg" rx="12"/>
  <rect width="800" height="170" fill="url(#grid)" rx="12"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="100" cy="40" r="80" fill="#1f6feb" opacity="0.15" class="glow-circle" filter="blur(30px)"/>
  <circle cx="700" cy="130" r="90" fill="#58a6ff" opacity="0.12" class="glow-circle" filter="blur(30px)"/>

  <!-- Border Highlight -->
  <rect x="2" y="2" width="796" height="166" fill="none" rx="10" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="796" height="166" fill="none" rx="10" class="border-line"/>

  <!-- Title & Subtitle -->
  <g text-anchor="middle">
    <text x="400" y="75" class="title" fill="url(#titleGrad)">SHOXJAXON ATABAYEV</text>
    <text x="400" y="110" class="subtitle">FULL STACK &amp; BACKEND DEVELOPER</text>
    
    <!-- Pills / Badges -->
    <g transform="translate(260, 126)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#161b22" stroke="#30363d"/>
      <text x="40" y="15" text-anchor="middle" class="badge-text">PYTHON</text>

      <rect x="90" y="0" width="80" height="22" rx="11" fill="#161b22" stroke="#30363d"/>
      <text x="130" y="15" text-anchor="middle" class="badge-text">FASTAPI</text>

      <rect x="180" y="0" width="90" height="22" rx="11" fill="#161b22" stroke="#30363d"/>
      <text x="225" y="15" text-anchor="middle" class="badge-text">POSTGRES</text>
    </g>
  </g>
</svg>
